version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chirp
      POSTGRES_PASSWORD: chirp
      POSTGRES_DB: chirp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirp"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models
    environment:
      MODEL_PATH: models/toxicity_model.pkl

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: super-secret-change-me
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: chirp
      DB_PASSWORD: chirp
      DB_NAME: chirp
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  pgdata:
